# Credentials come from this demo's .env (docker compose reads it automatically).
services:
  postgres:
    image: postgres:16
    container_name: postgres-day39
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:5432:5432' # localhost only — not reachable from the LAN
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # S3-compatible object storage (SeaweedFS). The access key below is the only identity,
  # so every request — including pre-signed URLs — must carry a valid signature.
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: s3-day39
    restart: always
    command: ['server', '-s3', '-s3.config=/etc/seaweedfs/s3.json', '-dir=/data']
    configs:
      - source: s3_identities
        target: /etc/seaweedfs/s3.json
    ports:
      - '127.0.0.1:9000:8333'
    volumes:
      - s3_data:/data

configs:
  s3_identities:
    content: |
      {"identities":[{"name":"app","credentials":[{"accessKey":"${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}","secretKey":"${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

volumes:
  postgres_data:
  s3_data:
