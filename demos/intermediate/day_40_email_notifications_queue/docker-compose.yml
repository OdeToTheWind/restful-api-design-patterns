services:
  redis:
    image: redis:7-alpine
    container_name: redis-day40
    restart: always
    # Queue data must survive restarts (unlike a cache): keep AOF persistence on
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data

  # Catches every email instead of delivering it. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit-day40
    restart: always
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  redis_data:
