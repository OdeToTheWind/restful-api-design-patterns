name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the run that's still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # Also builds @restful/shared (prepare) and generates each demo's Prisma client (postinstall)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Build (type-check every workspace package)
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Test (with coverage thresholds)
        run: pnpm test:coverage

      - name: Coverage summary
        if: always() && matrix.node-version == '24.x'
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always() && matrix.node-version == '24.x'
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: |
            shared/coverage/
            demos/**/coverage/
          retention-days: 14
          if-no-files-found: ignore

  # Real databases: the bash smoke test (Days 26–50) and the Testcontainers suite (Day 45)
  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: 'Smoke test — Beginner (Days 1–25)'
        run: pnpm smoke:beginner

      - name: 'Smoke test — Phase 1: Core (Days 26–33)'
        run: pnpm smoke:phase1

      - name: 'Smoke test — Phase 2: Services (Days 34–43)'
        run: pnpm smoke:phase2

      - name: 'Smoke test — Phase 3: Advanced (Days 44–50)'
        run: pnpm smoke:phase3

      - name: Integration tests (Testcontainers)
        run: pnpm test:integration

  # The production image (Day 46): build it, run the full compose stack, check it end to end
  docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: demos/intermediate/day_46_docker_containerization
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: day46

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (layer cache shared between runs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/demo.Dockerfile
          build-args: PACKAGE=day_46_docker_containerization
          tags: restful-api/day46:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack and wait until every service is healthy
        run: docker compose up --no-build --wait --wait-timeout 120

      - name: Check the running API
        run: |
          set -euo pipefail
          curl -fsS localhost:3046/ready
          curl -fsS -X POST localhost:3046/api/items -H 'Content-Type: application/json' -d '{"name":"from CI"}'
          curl -fsS localhost:3046/api/items | grep -q 'from CI'
          test "$(docker inspect --format '{{.Config.User}}' day46-api-1)" = node

      - name: Graceful shutdown exits 0
        run: |
          docker compose stop api
          test "$(docker inspect --format '{{.State.ExitCode}}' day46-api-1)" = 0

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$REPO_LOWER/day46"
          docker tag restful-api/day46:local "$IMAGE:latest"
          docker tag restful-api/day46:local "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
